[project]
name = "inspiratio-harmonization"
version = "0.0.0"
description = "MODIS x VIIRS active-fire harmonization (data analysis and algorithms)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Data
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "h5py>=3.11",          # GFED4.1s burned area (HDF5)
    # Models and statistics
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "optuna>=4.0",
    # Plots
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
notebook = [
    "jupyterlab>=4.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "data", "harmonization/variants"]  # S10 records, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
