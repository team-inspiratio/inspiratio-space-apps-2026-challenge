# Install once per clone:  uv run pre-commit install
# The same checks run again in CI (.github/workflows/ci.yml).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types: [python]
      - id: guardrails
        name: repo guardrails (frozen files, features, locked downloads, keys)
        entry: uv run --no-sync python -X utf8 tools/guardrails.py check
        language: system
        pass_filenames: false
