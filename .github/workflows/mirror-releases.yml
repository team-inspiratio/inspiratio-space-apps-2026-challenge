# Publish the data Releases in this repository, copying them unchanged from the source named in
# the repository secrets.
#
# Needs two repository secrets: SOURCE_REPO (owner/name of the source) and SOURCE_REPO_TOKEN
# (a fine-grained token with read-only "Contents" access to it). Both stay masked in the logs.
# Writing the Releases here uses the workflow's own GITHUB_TOKEN.
#
# Every file is checked against the SHA256 digest GitHub recorded for it in the source Release,
# before upload and again after upload. Tags that already exist here are skipped, so the workflow
# can be re-run safely. A half-finished copy is left as a draft and replaced on the next run.
name: Mirror data releases

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to copy, space separated (oldest first; the last becomes Latest)"
        default: "data-v0 v1 global-v1"
  push:
    branches: ["claude/vigilant-clarke-npis2w"]
    paths: [".github/workflows/mirror-releases.yml"]

permissions:
  contents: write

concurrency:
  group: mirror-releases
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
      TARGET_REPO: ${{ github.repository }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
      TAGS: ${{ inputs.tags || 'data-v0 v1 global-v1' }}
      SRC_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
      DST_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the secrets
        run: |
          if [ -z "$SRC_TOKEN" ] || [ -z "$SOURCE_REPO" ]; then
            echo "::error::Repository secrets SOURCE_REPO and SOURCE_REPO_TOKEN must both be set. Add them, then re-run this workflow."
            exit 1
          fi

      - name: Copy and verify releases
        run: |
          set -euo pipefail
          for tag in $TAGS; do
            echo "::group::$tag"
            existing=$(GH_TOKEN="$DST_TOKEN" gh api "repos/$TARGET_REPO/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag\") | \"\(.id) \(.draft)\"" | head -n1)
            if [ -n "$existing" ]; then
              read -r rid draft <<<"$existing"
              if [ "$draft" = "true" ]; then
                echo "Deleting unfinished draft of $tag from an earlier run"
                GH_TOKEN="$DST_TOKEN" gh api -X DELETE "repos/$TARGET_REPO/releases/$rid"
              else
                echo "$tag is already published in $TARGET_REPO; skipping"
                echo "::endgroup::"
                continue
              fi
            fi

            work="$RUNNER_TEMP/$tag"
            rm -rf "$work"; mkdir -p "$work/files"
            GH_TOKEN="$SRC_TOKEN" gh api "repos/$SOURCE_REPO/releases/tags/$tag" > "$work/release.json"
            jq -r '.assets[] | "\((.digest // "null") | sub("^sha256:"; ""))  \(.name)"' "$work/release.json" | sort -k2 > "$work/want.sha256"
            if grep -q "^null  " "$work/want.sha256"; then
              echo "::error::$tag: the source release has assets without a recorded digest"; exit 1
            fi

            GH_TOKEN="$SRC_TOKEN" gh release download "$tag" --repo "$SOURCE_REPO" -D "$work/files"
            (cd "$work/files" && sha256sum --strict -c "$work/want.sha256")
            [ "$(ls "$work/files" | wc -l)" -eq "$(wc -l < "$work/want.sha256")" ]

            jq -r '.name' "$work/release.json" > "$work/title.txt"
            jq -r '.body' "$work/release.json" > "$work/notes.md"

            flags=(--draft --target "$TARGET_BRANCH" --title "$(cat "$work/title.txt")" --notes-file "$work/notes.md")
            if [ "$(jq -r '.prerelease' "$work/release.json")" = "true" ]; then flags+=(--prerelease); fi
            GH_TOKEN="$DST_TOKEN" gh release create "$tag" --repo "$TARGET_REPO" "${flags[@]}" "$work"/files/*

            GH_TOKEN="$DST_TOKEN" gh api "repos/$TARGET_REPO/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$tag\") | .assets[] | \"\((.digest // \"null\") | sub(\"^sha256:\"; \"\"))  \(.name)\"" \
              | sort -k2 > "$work/got.sha256"
            if ! diff -u "$work/want.sha256" "$work/got.sha256"; then
              echo "::error::$tag: uploaded assets differ from the source release; left as a draft"; exit 1
            fi

            GH_TOKEN="$DST_TOKEN" gh release edit "$tag" --repo "$TARGET_REPO" --draft=false
            echo "Published $tag: $(wc -l < "$work/want.sha256") files, digests identical to the source"
            rm -rf "$work"
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Releases in $TARGET_REPO"
            GH_TOKEN="$DST_TOKEN" gh release list --repo "$TARGET_REPO" --limit 20
          } >> "$GITHUB_STEP_SUMMARY"
